name: Atualizar LatinaSat EPG

on:
  schedule:
    # Roda todos os dias às 04:00 AM UTC (01:00 AM Horário de Brasília)
    - cron: '0 4 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o código do seu repositório
    - name: Code Checkout
      uses: actions/checkout@v4

    # 2. Configura o ambiente Python
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Instala as dependências
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Executa o script que gera o XMLTV
    - name: Run EPG Extractor
      run: python gerar_epg.py

    # 5. Atualiza a data e hora diretamente no README.md usando Bash (Fuso Horário de Brasília)
    - name: Update Last Updated in README
      run: |
        # Captura a data atual formatada já no fuso de Brasília
        CURRENT_DATE=$(TZ="America/Sao_Paulo" date +"%d/%m/%Y às %H:%M")
        
        # Cria uma linha no estilo Badge usando escopo Markdown
        BADGE_LINE="🕒 **Última Atualização:** \`$CURRENT_DATE (BRT)\`"
        
        # Substitui a marcação (ou a linha antiga) no README pela nova data
        sed -i "s|<!-- LAST_UPDATE -->.*|<!-- LAST_UPDATE --> $BADGE_LINE|g" README.md
        
        # Fallback caso a linha não tenha o comentário invisível (garante que ela seja atualizada nas próximas execuções)
        if ! grep -q "<!-- LAST_UPDATE -->" README.md; then
          sed -i "s|🕒 \*\*Última Atualização:\*\*.*|<!-- LAST_UPDATE --> $BADGE_LINE|g" README.md
        fi

    # 6. Salva as alterações de volta no seu repositório (XML e README atualizados)
    - name: Commit and Push Changes
      run: |
        git config --local user.email "104462712+JulioCesarXY@users.noreply.github.com"
        git config --local user.name "JulioCesarXY"
        git add latinasat_epg.xml README.md
        
        # Faz o commit apenas se houver modificações reais
        git diff --quiet && git diff --staged --quiet || (git commit -m "EPG: Grade Atualizada ✅" && git push)
