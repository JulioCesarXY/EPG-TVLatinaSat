name: Atualizar TV LatinaSat EPG

on:
  schedule:
    # Roda todos os dias às 04:00 AM UTC (01:00 AM Horário de Brasília)
    - cron: '0 4 * * *'
  workflow_dispatch: # Permite que você clique em um botão e rode o script manualmente quando quiser

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o código do seu repositório para a máquina virtual do GitHub
    - name: Code Checkout
      uses: actions/checkout@v4

    # 2. Configura o ambiente Python moderno
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Instala as dependências necessárias (requests e bs4)
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Executa o seu script que puxa os dados e gera o arquivo latinasat_epg.xml
    - name: Run EPG Extractor
      run: python get_epg.py

    # 5. Salva o arquivo modificado de volta no seu repositório de forma automática
    - name: Commit and Push Changes
      run: |
        git config --local user.email "104462712+JulioCesarXY@users.noreply.github.com"
        git config --local user.name "JulioCesarXY"
        git add latinasat_epg.xml
        
        # Só faz o commit se houver mudanças reais no arquivo para evitar erros
        git diff --quiet && git diff --staged --quiet || (git commit -m "EPG Automático: Grade atualizada" && git push)
